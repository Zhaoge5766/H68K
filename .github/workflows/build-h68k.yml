name: Build H68K

# =============================================================================
# 编译 HinLink H68K 的 ImmortalWrt 固件
#
#   源码：Beaverfffan/immortalwrt-hinlink-full
#         这是一棵**已经把 HinLink 适配固化进去**的完整 immortalwrt 源码树
#         （基于 immortalwrt master，内核 6.18.55），configs/ 下每机型一份
#         .config，clone 下来就能编，不需要再打补丁。
#   产物：squashfs / ext4 的 sysupgrade 镜像 + manifest + sha256
#   去向：GitHub Release + 推送 firmware 分支到 Zhaoge5766/H68K
#
# 首次使用请配一个 secret：PUSH_TOKEN
#   classic PAT 勾 repo；或 fine-grained PAT 对 Zhaoge5766/H68K 授
#   Contents: Read and write。
#   如果本工作流就放在 Zhaoge5766/H68K 仓库里，可以不配 —— 下面的
#   `secrets.PUSH_TOKEN || github.token` 会自动回落到内置 token。
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      full_ref:
        description: "immortalwrt-hinlink-full 分支/标签"
        required: false
        default: master
      devices:
        description: "要编的机型（空格分隔，可选：h68k-a-b h68k-a-b-usb h68k-c-d-f h68k-c-d-f-usb h68k-new，留空=全部）"
        required: false
        default: ""
      publish:
        description: "构建成功后推送到 Zhaoge5766/H68K"
        type: boolean
        default: true

  schedule:
    # 每周六 04:00（北京时间）跟一次上游
    - cron: "0 20 * * 5"

  push:
    branches: [main]
    paths:
      - ".github/workflows/build-h68k.yml"

permissions:
  contents: write

concurrency:
  group: h68k-build
  cancel-in-progress: true

jobs:
  build:
    name: 编译
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      FULL_REF: ${{ inputs.full_ref || 'master' }}
      DEVICES: ${{ inputs.devices || 'h68k-a-b h68k-a-b-usb h68k-c-d-f h68k-c-d-f-usb h68k-new' }}
      PUSH_REPO: Zhaoge5766/H68K
      PUSH_BRANCH: firmware

    steps:
      # ---------------------------------------------------------------------
      # 磁盘：整棵树 build_dir 能到 10 GB 以上，GitHub 托管 runner 的 / 只有
      # 14 GB 左右。优先放到 /mnt（runner 上是一块 70 GB 的独立盘），
      # 放不下再退回 workspace。
      # ---------------------------------------------------------------------
      - name: 准备构建目录
        run: |
          set -euo pipefail
          echo "清理前："; df -h / /mnt 2>/dev/null | grep -v Filesystem || true
          sudo rm -rf \
            /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/share/swift /usr/lib/jvm 2>/dev/null || true
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile 2>/dev/null || true

          BUILD_ROOT="$GITHUB_WORKSPACE"
          if [ -d /mnt ]; then
            avail=$(df -BG --output=avail /mnt | tail -1 | tr -dc '0-9')
            if [ "${avail:-0}" -ge 40 ]; then
              BUILD_ROOT=/mnt/h68k
              sudo mkdir -p "$BUILD_ROOT"
              sudo chown -R "$(id -u):$(id -g)" "$BUILD_ROOT"
            fi
          fi
          mkdir -p "$BUILD_ROOT"
          echo "TREE=$BUILD_ROOT/immortalwrt-hinlink-full" >> "$GITHUB_ENV"
          echo "OUT=$BUILD_ROOT/out" >> "$GITHUB_ENV"
          echo "构建目录：$BUILD_ROOT"
          df -h "$BUILD_ROOT" | tail -1

      - name: 取源码
        run: |
          set -euo pipefail
          # 仓库 400+ MB，--depth 1 只取最新提交
          git clone --depth 1 --branch "$FULL_REF" \
            https://github.com/Beaverfffan/immortalwrt-hinlink-full.git "$TREE"
          cd "$TREE"
          echo "SOURCE_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_DATE=$(git log -1 --format=%cs)" >> "$GITHUB_ENV"
          echo "内核：$(grep -h '^KERNEL_PATCHVER' target/linux/rockchip/Makefile | head -1)"

      - name: 更新 feeds
        working-directory: ${{ env.TREE }}
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 关键一步（官方 README 明确要求）：
      # feeds 里有和自己维护的包**同名**的包（fancontrol / luci-app-fancontrol /
      # luci-app-oled），install -a 会在 package/feeds/*/ 建软链，而 OpenWrt 按
      # 字母序扫 package/，feeds 晚于 package/beaverfffan 加载 ⇒ 同名包被 feed
      # 那份**静默覆盖**：编译不报错，但装进固件的是上游版（温控默认关、
      # OLED 界面拿 eth0 而不是 wwan0）。这里把软链删掉，让本地版胜出。
      - name: 清理与本地包同名的 feed 包
        working-directory: ${{ env.TREE }}
        run: |
          set -euo pipefail
          for d in package/beaverfffan/*/; do
            [ -d "$d" ] || continue
            name=$(basename "$d")
            hit=$(find package/feeds -maxdepth 2 -name "$name" 2>/dev/null || true)
            if [ -n "$hit" ]; then
              echo "$hit" | while read -r p; do rm -rf "$p"; echo "  删除冲突软链 $p"; done
            fi
          done

      - name: 组装 .config（多机型）
        working-directory: ${{ env.TREE }}
        run: |
          set -euo pipefail

          dev_symbol() {
            case "$1" in
              h68k-a-b)      echo hinlink_opc-h68k-a-b ;;
              h68k-a-b-usb)  echo hinlink_opc-h68k-a-b-usb ;;
              h68k-c-d-f)    echo hinlink_opc-h68k-c-d-f ;;
              h68k-c-d-f-usb) echo hinlink_opc-h68k-c-d-f-usb ;;
              h68k-new)      echo hinlink_opc-h68k-new ;;
              *) echo "" ;;
            esac
          }

          # 用第一个机型的 config 当底板（分区大小、包选择都来自仓库那份）
          base="$DEVICES"; base="${base%% *}"
          [ -f "configs/$base.config" ] || { echo "::error::缺少 configs/$base.config"; exit 1; }
          cp "configs/$base.config" .config
          echo "底板配置：configs/$base.config"

          for short in $DEVICES; do
            sym=$(dev_symbol "$short")
            if [ -z "$sym" ]; then
              echo "::error::不认识的机型 '$short'"
              exit 1
            fi
            key="CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_${sym}"
            # .config 里本来就有一行 "# <key> is not set"，改成 =y
            sed -i "s|^# ${key} is not set|${key}=y|" .config
            grep -qx "${key}=y" .config || echo "${key}=y" >> .config
            echo "  选中 $short -> $sym"
          done

          # 开 ccache：首次编译慢一点，之后每次能省一大截
          sed -i 's|^# CONFIG_CCACHE is not set|CONFIG_CCACHE=y|' .config
          grep -q '^CONFIG_CCACHE=y' .config || echo 'CONFIG_CCACHE=y' >> .config
          # ccache 目录固定到树内，方便跟 actions/cache 对应
          sed -i "s|^CONFIG_CCACHE_DIR=.*|CONFIG_CCACHE_DIR=\"$PWD/.ccache\"|" .config

          make defconfig

          echo
          echo "=== 最终选中的机型 ==="
          grep -E '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink.*=y$' .config || true

          want=$(echo "$DEVICES" | wc -w)
          got=$(grep -cE '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink.*=y$' .config || true)
          if [ "$got" -ne "$want" ]; then
            echo "::error::期望 $want 个机型，实际 $got 个 —— 机型符号没被 kconfig 接受"
            exit 1
          fi
          if ! grep -qx 'CONFIG_PACKAGE_u-boot-hinlink-h68k-rk3568=y' .config; then
            echo "::error::u-boot 变体 hinlink-h68k-rk3568 没被选中，镜像阶段会缺 u-boot-rockchip.bin"
            exit 1
          fi
          echo "u-boot: hinlink-h68k-rk3568 ✓"

      - name: 缓存 dl/ 与 ccache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.TREE }}/dl
            ${{ env.TREE }}/.ccache
          key: h68k-${{ env.FULL_REF }}-${{ github.run_id }}
          restore-keys: |
            h68k-${{ env.FULL_REF }}-

      - name: 下载依赖
        working-directory: ${{ env.TREE }}
        run: |
          set -uo pipefail
          ok=0
          for i in 1 2 3; do
            echo "== 第 $i 次下载 =="
            if make -j8 download; then ok=1; break; fi
            sleep 20
          done
          [ "$ok" = "1" ] || echo "::warning::有依赖没下全，编译阶段会再试一次"

      - name: 编译固件
        working-directory: ${{ env.TREE }}
        run: |
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee build.log

      - name: 失败摘要
        if: failure()
        continue-on-error: true
        working-directory: ${{ env.TREE }}
        run: |
          echo "=========== 错误行 ==========="
          grep -nE 'ERROR:|Error [0-9]|is missing|No rule to make target|fatal error|undefined reference' build.log | tail -60 || true
          echo
          echo "=========== 日志末尾 ==========="
          tail -80 build.log || true

      - name: 收集固件
        working-directory: ${{ env.TREE }}
        run: |
          set -euo pipefail
          BIN=bin/targets/rockchip/armv8
          mkdir -p "$OUT"
          shopt -s nullglob
          found=0
          for f in "$BIN"/*h68k*.img.gz "$BIN"/*h68k*.manifest "$BIN"/*h68k*.buildinfo; do
            cp -v "$f" "$OUT/"
            found=$((found + 1))
          done
          cp -v "$BIN/profiles.json" "$OUT/" 2>/dev/null || true
          if [ "$found" -eq 0 ]; then
            echo "::error::没收到任何 h68k 产物"
            ls -l "$BIN" || true
            exit 1
          fi
          ( cd "$OUT" && sha256sum * > sha256sums.txt )
          {
            echo "## HinLink H68K · ImmortalWrt"
            echo
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 构建时间 | $(date -u '+%Y-%m-%d %H:%M UTC') |"
            echo "| 源码 | Beaverfffan/immortalwrt-hinlink-full \`${FULL_REF}\` @ \`${SOURCE_COMMIT}\` |"
            echo "| 机型 | ${DEVICES} |"
            echo "| run | #${GITHUB_RUN_NUMBER} |"
            echo
            echo "### 产物"
            echo '```'
            ( cd "$OUT" && ls -1 )
            echo '```'
            echo
            echo "刷机："
            echo "- 已在同款固件上：\`sysupgrade -n xxx-squashfs-sysupgrade.img.gz\`（LuCI 里直接升级也行）"
            echo "- 原厂固件首次刷：用 \`-factory.img.gz\`，按机型走线刷 / TF 卡刷"
            echo "- 首次进系统：LAN 口 \`192.168.100.1\`，无密码"
          } > "$OUT/RELEASE.md"
          ls -lh "$OUT"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: h68k-firmware-${{ github.run_number }}
          path: ${{ env.OUT }}/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: 推送固件
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    env:
      PUSH_REPO: Zhaoge5766/H68K
      PUSH_BRANCH: firmware

    steps:
      - name: 取回构建产物
        uses: actions/download-artifact@v4
        with:
          name: h68k-firmware-${{ github.run_number }}
          path: out

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.PUSH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          TAG="h68k-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          # RELEASE.md 只用来当说明文字，不当附件上传
          assets=$(ls out/* | grep -v 'out/RELEASE.md' || true)
          gh release create "$TAG" $assets \
            --repo "$PUSH_REPO" \
            --title "H68K $(date -u '+%Y-%m-%d') build #${GITHUB_RUN_NUMBER}" \
            --notes-file out/RELEASE.md
          echo "Release: https://github.com/${PUSH_REPO}/releases/tag/${TAG}" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: 推送到固件分支
        env:
          GH_TOKEN: ${{ secrets.PUSH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 用 insteadOf 注入凭据，避免 token 出现在命令行和日志里
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

          rm -rf repo
          git clone "https://github.com/${PUSH_REPO}.git" repo
          cd repo

          # 固件分支每次只有一个提交：仓库不会随时间膨胀，
          # 历史产物都在 Releases 里，main 分支也不受影响。
          git checkout --orphan "$PUSH_BRANCH" 2>/dev/null || git checkout -B "$PUSH_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true

          STAMP="$(date -u +%Y%m%d)"
          mkdir -p "firmware/$STAMP"
          cp ../out/* "firmware/$STAMP/"

          cat > README.md <<EOF
          # H68K 固件

          由 GitHub Actions 自动构建：ImmortalWrt + HinLink H68K 适配
          （源码 [Beaverfffan/immortalwrt-hinlink-full](https://github.com/Beaverfffan/immortalwrt-hinlink-full)）。

          历次产物在 [Releases](https://github.com/${PUSH_REPO}/releases) 里。

          本分支 \`${PUSH_BRANCH}\` 只保留**最近一次**构建，每次覆盖。

          | 项 | 值 |
          | --- | --- |
          | 构建时间 | $(date -u '+%Y-%m-%d %H:%M UTC') |
          | run | #${GITHUB_RUN_NUMBER} |

          刷机：\`sysupgrade -n *.img.gz\`；原厂首次刷用 \`-factory.img.gz\`。
          首次进系统 LAN 口 \`192.168.100.1\`，无密码。
          EOF

          git add -A
          git commit -m "firmware: ${STAMP} (run #${GITHUB_RUN_NUMBER})"
          git push --force origin "HEAD:${PUSH_BRANCH}"

      - name: 汇总
        run: |
          {
            echo "### 产物已推送"
            echo "- Release：https://github.com/Zhaoge5766/H68K/releases"
            echo "- 固件分支：https://github.com/Zhaoge5766/H68K/tree/firmware"
          } >> "$GITHUB_STEP_SUMMARY"
