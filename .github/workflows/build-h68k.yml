name: Build H68K

# =============================================================================
# 编译 HinLink H68K 的 ImmortalWrt 固件
#
#   源码：immortalwrt/immortalwrt（**官方**源码，跟着 master 走）
#   适配：Beaverfffan/immortalwrt-hinlink（设备适配层，运行时注入）
#
# 和直接用 Beaverfffan 那棵 "-full" 整树编译的区别：
#   · 内核、uboot、通用包全部来自官方 immortalwrt，能跟上游更新
#   · 只注入 H68K 需要的东西：DTS / 机型定义 / board.d 分支 / 3 个内核补丁 /
#     1 个 u-boot 补丁 / 7 个本地包（风扇、OLED、5G 复位、aic8800 等）
#   · 注入过程见 scripts/inject-hinlink.py，每一步都带校验，失败就停
#
# 产物：sysupgrade 镜像 + manifest + sha256
# 去向：GitHub Release + 强推 firmware 分支（都推到 Zhaoge5766/H68K）
#
# 首次使用若要推到**别的**仓库，需要配 secret PUSH_TOKEN（PAT，Contents: RW）。
# 本工作流就跑在 Zhaoge5766/H68K 里，所以不配也行 —— 会回落到内置 token。
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      iwrt_ref:
        description: "官方 immortalwrt 分支/标签"
        required: false
        default: master
      overlay_ref:
        description: "适配层（immortalwrt-hinlink）分支/标签"
        required: false
        default: main
      devices:
        description: "机型（空格分隔：h68k-a-b h68k-a-b-usb h68k-c-d-f h68k-c-d-f-usb h68k-new；留空=只编 h68k-new）"
        required: false
        default: ""
      publish:
        description: "构建成功后推送固件"
        type: boolean
        default: true

  schedule:
    # 每周六 04:00（北京时间）跟一次上游
    - cron: "0 20 * * 5"

  push:
    branches: [main]
    paths:
      - ".github/workflows/build-h68k.yml"
      - "scripts/**"
      - "configs/**"
      - "diy-part1.sh"
      - "diy-part2.sh"

permissions:
  contents: write

concurrency:
  group: h68k-build
  cancel-in-progress: true

env:
  IWRT_REPO: https://github.com/immortalwrt/immortalwrt.git
  OVERLAY_REPO: https://github.com/Beaverfffan/immortalwrt-hinlink.git
  TREE: ${{ github.workspace }}/immortalwrt
  PUSH_REPO: Zhaoge5766/H68K
  PUSH_BRANCH: firmware

jobs:
  build:
    name: 编译
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      DEVICES: ${{ inputs.devices || 'h68k-new' }}

    steps:
      - name: 释放 Ubuntu 磁盘空间
        run: |
          set -euo pipefail
          df -h / | tail -1
          sudo rm -rf \
            /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/share/swift /usr/lib/jvm 2>/dev/null || true
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile 2>/dev/null || true
          sudo apt-get -qq clean
          df -h / | tail -1

      - name: 加载项目文件
        uses: actions/checkout@v4

      # runner 镜像缺 python3-pyelftools 时，u-boot（rockchip）会在 prereq
      # 阶段直接中断：u-boot: Please install the Python3 elftools module。
      # 其余是 OpenWrt 常规主机依赖，一次装全，省得编到一半才发现缺东西。
      - name: 初始化编译环境
        run: |
          set -euo pipefail
          sudo apt-get -qq update
          sudo apt-get -qq -y install \
            build-essential clang flex bison g++ gawk gettext \
            gcc-multilib g++-multilib \
            libncurses-dev libssl-dev zlib1g-dev libelf-dev libncurses5 \
            python3-dev python3-setuptools python3-pyelftools \
            rsync swig unzip file wget curl bzip2 patch perl time \
            device-tree-compiler bc qemu-utils
          python3 -c "import elftools, sys; print('pyelftools', elftools.__version__, 'on', sys.version.split()[0])"
          nproc

      - name: 设置当前的日期
        run: |
          set -euo pipefail
          echo "BUILD_DATE=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
          echo "BUILD_STAMP=$(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_ENV"
          echo "构建日期：$(date -u '+%Y-%m-%d')"

      - name: 下载官方 ImmortalWrt 源码
        env:
          IWRT_REF: ${{ inputs.iwrt_ref || 'master' }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$IWRT_REF" "$IWRT_REPO" "$TREE"
          cd "$TREE"
          echo "IWRT_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "官方源码 $IWRT_REF @ $(git rev-parse --short HEAD)"
          KVER=$(sed -n 's/^KERNEL_PATCHVER:=\s*//p' target/linux/rockchip/Makefile)
          echo "内核：$KVER $(cat "target/linux/generic/kernel-$KVER" 2>/dev/null | head -1 || true)"
          # 确认这是官方树、且确实还没有 hinlink 支持（有的话说明上游已合入，
          # 适配层就该退场了 —— 这时候注入反而是多余的）
          if ls target/linux/rockchip/patches-*/ 2>/dev/null | grep -qi hinlink; then
            echo "::warning::官方树里已经出现 hinlink 补丁，适配层可能是多余的了"
          fi

      # 适配层是"官方源码 + 补丁"结构，不是 git am 能打的那种补丁集，
      # 必须按它自己的约定注入（board.d 要合并而不是覆盖）。
      - name: 注入 Beaverfffan 适配层
        env:
          OVERLAY_REF: ${{ inputs.overlay_ref || 'main' }}
        run: |
          set -euo pipefail
          OVERLAY_DIR="${{ github.workspace }}/overlay"
          rm -rf "$OVERLAY_DIR"
          git clone --depth 1 --branch "$OVERLAY_REF" "$OVERLAY_REPO" "$OVERLAY_DIR"
          echo "OVERLAY_COMMIT=$(git -C "$OVERLAY_DIR" rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "适配层 $OVERLAY_REF @ $(git -C "$OVERLAY_DIR" rev-parse --short HEAD)"
          echo
          python3 "${{ github.workspace }}/scripts/inject-hinlink.py" \
            --overlay "$OVERLAY_DIR" --tree "$TREE"

      - name: 执行DIY_P1_SH
        working-directory: ${{ env.TREE }}
        run: bash "${{ github.workspace }}/diy-part1.sh"

      - name: 更新feeds
        working-directory: ${{ env.TREE }}
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 加载config 执行DIY_P2_SH defconfig
        working-directory: ${{ env.TREE }}
        env:
          DEVICES: ${{ inputs.devices || 'h68k-new' }}
          CONFIG_SEED: ${{ github.workspace }}/configs/h68k.config
        run: bash "${{ github.workspace }}/diy-part2.sh"

      # 拿不到缓存时 dl/ 里啥都没有，第一次 make download 要下 2~4 GB
      - name: 缓存 dl/ 与 ccache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.TREE }}/dl
            ${{ env.TREE }}/.ccache
          key: h68k-${{ env.BUILD_DATE }}-${{ hashFiles('configs/**', 'scripts/**', 'diy-part*.sh') }}
          restore-keys: |
            h68k-

      - name: 下载安装包
        working-directory: ${{ env.TREE }}
        run: |
          set -uo pipefail
          ok=0
          for i in 1 2 3; do
            echo "== 第 $i 次下载 =="
            if make -j"$(nproc)" download; then ok=1; break; fi
            sleep 20
          done
          if [ "$ok" != "1" ]; then
            echo "::error::依赖下载连续失败 3 次，报错见上方 make 输出"
            exit 1
          fi

      - name: 编译固件
        working-directory: ${{ env.TREE }}
        run: |
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee build.log

      - name: 失败摘要
        if: failure()
        continue-on-error: true
        working-directory: ${{ env.TREE }}
        run: |
          echo "=========== 错误行 ==========="
          grep -nE 'ERROR:|Error [0-9]|is missing|No rule to make target|fatal error|undefined reference|patch.*fail' build.log 2>/dev/null | tail -60 || true
          echo
          echo "=========== 日志末尾 ==========="
          tail -80 build.log 2>/dev/null || true

      - name: 收集固件
        working-directory: ${{ env.TREE }}
        run: |
          set -euo pipefail
          BIN=bin/targets/rockchip/armv8
          OUT="${{ github.workspace }}/out"
          mkdir -p "$OUT"
          shopt -s nullglob
          found=0
          for f in "$BIN"/*h68k*.img.gz "$BIN"/*h68k*.manifest "$BIN"/*h68k*.buildinfo; do
            cp -v "$f" "$OUT/"
            found=$((found + 1))
          done
          cp -v "$BIN/profiles.json" "$OUT/" 2>/dev/null || true
          if [ "$found" -eq 0 ]; then
            echo "::error::没收到任何 h68k 产物"
            ls -l "$BIN" || true
            exit 1
          fi
          ( cd "$OUT" && sha256sum * > sha256sums.txt )
          {
            echo "## HinLink H68K · ImmortalWrt"
            echo
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 构建时间 | ${BUILD_STAMP} |"
            echo "| 官方源码 | immortalwrt \`${IWRT_COMMIT}\` |"
            echo "| 适配层 | immortalwrt-hinlink \`${OVERLAY_COMMIT}\` |"
            echo "| 机型 | ${DEVICES} |"
            echo "| run | #${GITHUB_RUN_NUMBER} |"
            echo
            echo "### 产物"
            echo '```'
            ( cd "$OUT" && ls -1 )
            echo '```'
            echo
            echo "刷机："
            echo "- 已在同款固件上：\`sysupgrade -n xxx-squashfs-sysupgrade.img.gz\`（LuCI 里直接升级也行）"
            echo "- 原厂固件首次刷：用 \`-factory.img.gz\`，按机型走线刷 / TF 卡刷"
            echo "- 首次进系统：LAN 口 \`192.168.100.1\`，无密码"
          } > "$OUT/RELEASE.md"
          ls -lh "$OUT"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: h68k-firmware-${{ github.run_number }}
          path: ${{ github.workspace }}/out/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: 推送固件
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: 取回构建产物
        uses: actions/download-artifact@v4
        with:
          name: h68k-firmware-${{ github.run_number }}
          path: out

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.PUSH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          TAG="h68k-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          assets=$(ls out/* | grep -v 'out/RELEASE.md' || true)
          gh release create "$TAG" $assets \
            --repo "$PUSH_REPO" \
            --title "H68K $(date -u '+%Y-%m-%d') build #${GITHUB_RUN_NUMBER}" \
            --notes-file out/RELEASE.md
          echo "Release: https://github.com/${PUSH_REPO}/releases/tag/${TAG}" \
            >> "$GITHUB_STEP_SUMMARY"

      # 固件分支每次只有一个提交：仓库不会随时间膨胀，
      # 历史产物都在 Releases 里，main 分支也不受影响。
      - name: 推送到固件分支
        env:
          GH_TOKEN: ${{ secrets.PUSH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 用 insteadOf 注入凭据，避免 token 出现在命令行和日志里
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

          rm -rf repo
          git clone "https://github.com/${PUSH_REPO}.git" repo
          cd repo
          git checkout --orphan "$PUSH_BRANCH" 2>/dev/null || git checkout -B "$PUSH_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true

          STAMP="$(date -u +%Y%m%d)"
          mkdir -p "firmware/$STAMP"
          cp ../out/* "firmware/$STAMP/"

          cat > README.md <<EOF
          # H68K 固件

          由 GitHub Actions 自动构建：官方 ImmortalWrt + HinLink 适配层
          （[Beaverfffan/immortalwrt-hinlink](https://github.com/Beaverfffan/immortalwrt-hinlink)）。

          历次产物在 [Releases](https://github.com/${PUSH_REPO}/releases) 里。

          本分支 \`${PUSH_BRANCH}\` 只保留**最近一次**构建，每次覆盖。

          | 项 | 值 |
          | --- | --- |
          | 构建时间 | $(date -u '+%Y-%m-%d %H:%M UTC') |
          | run | #${GITHUB_RUN_NUMBER} |

          刷机：\`sysupgrade -n *.img.gz\`；原厂首次刷用 \`-factory.img.gz\`。
          首次进系统 LAN 口 \`192.168.100.1\`，无密码。
          EOF

          git add -A
          git commit -m "firmware: ${STAMP} (run #${GITHUB_RUN_NUMBER})"
          git push --force origin "HEAD:${PUSH_BRANCH}"

      - name: 汇总
        run: |
          {
            echo "### 产物已推送"
            echo "- Release：https://github.com/Zhaoge5766/H68K/releases"
            echo "- 固件分支：https://github.com/Zhaoge5766/H68K/tree/firmware"
          } >> "$GITHUB_STEP_SUMMARY"
